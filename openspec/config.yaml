schema: spec-driven

# Project context, shown to AI when creating artifacts. AGENTS.md is the
# source of truth for the conventions: keep this text consistent with it.

context: |
  Komodo CD is a thin layer between people, CI pipelines and a Komodo
  instance: it stores the Komodo connection and API keys and turns
  POST /api/v0/deploy into a pull/redeploy on Komodo. Monorepo on Bun +
  Turborepo: Hono + oRPC + Better Auth + Drizzle/SQLite (libsql) backend,
  Astro 7 SSR + React 19 islands + Tailwind v4 + shadcn/ui frontend, Caddy
  gateway, Biome. A small ask is a small change; never remove existing
  features unless the user asks.

  Backend API convention (packages/api): context.ts, errors.ts and the
  procedure builders in index.ts live at src/ and are shared by every API
  version. Each feature is a folder under src/<version>/<feature>/ (today
  only src/v0/) split into input.ts (zod, <feature>Input), output.ts (zod,
  <feature>Output), handler.ts (<feature>Handler, methods take one options
  object) and router.ts (wiring only: tier -> .route() -> .input() ->
  .output() -> .handler()). A new feature is a new folder plus one key in
  src/<version>/router.ts; the package-root router.ts nests each version
  under its own key (v0: v0Router), so calls read
  orpc.v0.<feature>.<method>() and paths /rpc/v0/... and /api/v0/....
  Komodo and ntfy services live in src/lib/. Throw errors only through the
  errors.ts constructor map (errors.NOT_FOUND(), ...); Komodo failures go
  through toKomodoError (502 Komodo error, 503 no connection).

  Access rules: protectedProcedure (session or x-api-key) for what CI needs
  (deploy, stacks, history); sessionProcedure (session only, 403 for an API
  key) for anything that reads or changes configuration or credentials
  (Komodo connection, ntfy, API keys).

  Imports: shared packages use Node subpath imports declared in their
  package.json ("#*": "./src/*.ts", e.g. #v0/deploy/handler, #lib/komodo);
  apps use @/ for their own src only; other workspaces are imported by
  package name (@komodo-cd/<pkg>).

  Frontend convention (apps/frontend/src): domain code lives in
  features/<domain>/ with only the technical folders it uses (components/,
  hooks/, model/) and an index.ts public entry point. Pages in pages/ only
  mount one feature island wrapped with withIsland (providers/island.tsx).
  Shared helpers in lib/, shared hooks in hooks/, shadcn primitives in
  components/ui/, reusable patterns in components/shared/. Data is read
  with useHydratedQuery over the orpc TanStack Query utilities; mutations
  invalidate the queries they affect. Search and reuse before creating.

  Language: identifiers are English, code comments are Spanish. UI copy
  goes through the i18n dictionaries (apps/frontend/src/locales/es.ts and
  en.ts, Spanish default). README.md is English; the site docs exist in
  English and Spanish and change together. OpenSpec artifacts are English.

  Environment: one root .env (template .env.example), validated by
  packages/env/src/server.ts. Never add per-app .env files.

  Migrations: an agent never generates, pushes, runs or edits migrations
  (db:generate, db:push, db:migrate, packages/db/src/migrations/) nor edits
  packages/db/src/schema/ unless the user explicitly asks. If a change needs
  a migration, the design and tasks say so and leave it to the user.

rules:
  proposal:
    - State whether the change needs a database migration; if it does, the
      migration is generated by the user, not by the agent.
  design:
    - For every new or changed procedure, name its access tier
      (protectedProcedure or sessionProcedure) and why.
  tasks:
    - Every task group that adds or changes a procedure or an API helper
      ends with a task that writes its tests in packages/api/tests/
      (fixtures in tests/fixtures/) and runs bun run test.
    - Every task group that adds UI copy adds it to both
      apps/frontend/src/locales/es.ts and en.ts.
    - The last task group runs bun run check-types, bunx biome check . and,
      when Tailwind classes changed, bun run tailwind:check.
