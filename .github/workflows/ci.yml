name: CI

# Lint, tipos, tests y migraciones. Corre en cada PR, y docker-build.yml lo
# llama antes de construir las imágenes (push a main, ramas v* y tags), así
# que no se publica ninguna imagen si falla.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

# Un push nuevo a la misma PR cancela el run anterior. Llamado desde
# docker-build.yml no hay head_ref y cada run va en su propio grupo.
concurrency:
  group: ci-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # La versión de Bun sale de `packageManager` en el package.json raíz.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Formato y lint sin escribir nada
      - name: Biome
        run: bunx biome ci .

      - name: Type check
        run: bun run check-types

      - name: Tests
        run: bun run test

      # Las migraciones generadas coinciden con el schema
      - name: Migrations
        run: bun run db:check

  # La action de deploy (action.yml) contra un Komodo CD simulado: 200, 502 y
  # validación de inputs.
  deploy-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Start mock Komodo CD
        run: |
          cat > "$RUNNER_TEMP/mock.py" <<'PY'
          import json
          from http.server import BaseHTTPRequestHandler, HTTPServer

          class Handler(BaseHTTPRequestHandler):
              def do_POST(self):
                  raw = self.rfile.read(int(self.headers.get("Content-Length", 0)))
                  if self.path != "/api/v0/deploy":
                      return self.reply(404, {"message": "Not found"})
                  if self.headers.get("x-api-key") != "test-key":
                      return self.reply(401, {"message": "Unauthorized"})
                  body = json.loads(raw)
                  if body["stack"] == "broken":
                      return self.reply(502, {"message": "Komodo: stack not found"})
                  self.reply(200, {"success": True, "message": f"{body['action']} {body['stack']}", **body})

              def reply(self, code, data):
                  out = json.dumps(data).encode()
                  self.send_response(code)
                  self.send_header("Content-Type", "application/json")
                  self.send_header("Content-Length", str(len(out)))
                  self.end_headers()
                  self.wfile.write(out)

          HTTPServer(("127.0.0.1", 8765), Handler).serve_forever()
          PY
          python3 "$RUNNER_TEMP/mock.py" &
          sleep 1

      - name: Deploy succeeds
        id: ok
        uses: ./
        with:
          url: http://127.0.0.1:8765/
          api-key: test-key
          stack: we"b$(echo injected)

      - name: Komodo error fails the step
        id: broken
        continue-on-error: true
        uses: ./
        with:
          url: http://127.0.0.1:8765
          api-key: test-key
          stack: broken
          action: redeploy

      - name: Unknown action fails the step
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          url: http://127.0.0.1:8765
          api-key: test-key
          stack: web
          action: restart

      - name: Check outcomes
        env:
          OK_STATUS: ${{ steps.ok.outputs.status }}
          OK_MESSAGE: ${{ steps.ok.outputs.message }}
          BROKEN: ${{ steps.broken.outcome }}
          BROKEN_STATUS: ${{ steps.broken.outputs.status }}
          INVALID: ${{ steps.invalid.outcome }}
          INVALID_STATUS: ${{ steps.invalid.outputs.status }}
        run: |
          set -x
          [ "$OK_STATUS" = 200 ]
          [ "$OK_MESSAGE" = 'pull-redeploy we"b$(echo injected)' ]
          [ "$BROKEN" = failure ] && [ "$BROKEN_STATUS" = 502 ]
          [ "$INVALID" = failure ] && [ -z "$INVALID_STATUS" ]
