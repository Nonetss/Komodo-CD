name: Pages

# Construye la web del proyecto (apps/site, Astro estático) y la publica en
# GitHub Pages en https://nonetss.github.io/Komodo-CD/. Requiere
# Settings → Pages → Source: GitHub Actions.
on:
  push:
    branches:
      - main
    paths:
      - "apps/site/**"
      - "img/**"
      - "bun.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue cada vez; nunca se cancela uno que ya está publicando.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # La versión de Bun sale de `packageManager` en el package.json raíz.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      # Install completo, no --filter site: las capturas viven en img/ de la
      # raíz y Vite las resuelve con el tsconfig raíz, que extiende
      # @komodo-cd/config de las devDependencies raíz.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build
        run: bun run --filter site build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
