name: Docker Image CI

on:
  push:
    branches:
      - main
      - "v*"
    # Una release (tag vX.Y.Z) publica también las imágenes versionadas
    tags:
      - "v*.*.*"

# Un push nuevo a la misma ref cancela el run anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Ninguna imagen se publica si no pasan lint, tipos y tests
  verify:
    uses: ./.github/workflows/ci.yml

  # Qué imágenes reconstruir: solo las que pueden haber cambiado con el push.
  # Un tag de versión las publica todas.
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filter.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect images to rebuild
        id: filter
        env:
          BEFORE: ${{ github.event.before }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          # Rutas que pueden cambiar cada imagen; el workflow y .dockerignore
          # las reconstruyen todas.
          declare -A PATHS=(
            [backend]="apps/backend/ packages/ package.json bun.lock bunfig.toml"
            [frontend]="apps/frontend/ packages/ package.json bun.lock bunfig.toml"
            [gateway]="apps/gateway/"
          )
          COMMON=".github/workflows/docker-build.yml .github/workflows/ci.yml .dockerignore"

          # Tag, rama nueva o force push: sin base útil, se construye todo
          if [ "$REF_TYPE" = "tag" ] || [ -z "$BEFORE" ] \
            || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            CHANGED="__all__"
          else
            CHANGED=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          fi
          echo "Changed files:"; echo "$CHANGED"

          matches() {
            [ "$CHANGED" = "__all__" ] && return 0
            for p in $COMMON $1; do
              echo "$CHANGED" | grep -q "^$p" && return 0
            done
            return 1
          }

          ITEMS=()
          for name in backend frontend gateway; do
            if matches "${PATHS[$name]}"; then
              ITEMS+=("{\"name\":\"$name\",\"dockerfile\":\"apps/$name/Dockerfile\"}")
            fi
          done
          MATRIX="[$(IFS=,; echo "${ITEMS[*]}")]"
          echo "Matrix: $MATRIX"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  build:
    needs: [verify, changes]
    if: needs.changes.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io/<owner>/komodo-cd-{backend,frontend,gateway}. backend y frontend
      # son los nombres que publicaban los repos separados.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/komodo-cd-${{ matrix.name }}
          # main -> latest, main, main-<sha>; tag v1.2.3 -> 1.2.3, 1.2.
          # La tag sha solo en ramas: en un tag no hay {{branch}} y saldría "-<sha>".
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # El contexto es la raíz del monorepo (bun.lock y workspaces viven ahí).
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
