name: Docker Image CI

on:
  push:
    branches:
      - main
      - "v*"
    # Una release (tag vX.Y.Z) publica también las imágenes versionadas
    tags:
      - "v*.*.*"

# Un push nuevo a la misma ref cancela el run anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            dockerfile: apps/backend/Dockerfile
          - name: frontend
            dockerfile: apps/frontend/Dockerfile
          - name: gateway
            dockerfile: apps/gateway/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ghcr.io/<owner>/komodo-cd-{backend,frontend,gateway}. backend y frontend
      # son los nombres que publicaban los repos separados.
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/komodo-cd-${{ matrix.name }}
          # main -> latest, main, main-<sha>; tag v1.2.3 -> 1.2.3, 1.2.
          # La tag sha solo en ramas: en un tag no hay {{branch}} y saldría "-<sha>".
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,prefix={{branch}}-,format=short,enable=${{ github.ref_type == 'branch' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # El contexto es la raíz del monorepo (bun.lock y workspaces viven ahí).
      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
